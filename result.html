<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elim Center 상담 결과지</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Noto Sans KR', sans-serif; background: #f5f5f7; color: #2d2d2d; }

        /* ── Screen styles ── */
        .page-wrap { max-width: 800px; margin: 0 auto; padding: 32px 20px 64px; }

        .result-header {
            background: linear-gradient(135deg, #7c4dff, #e91e8c);
            color: #fff; border-radius: 20px;
            padding: 28px 32px; margin-bottom: 24px;
            display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px;
        }
        .result-header .org { font-size: 11px; font-weight: 700; letter-spacing: 2px; opacity: .8; margin-bottom: 6px; }
        .result-header h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
        .result-header .sub { font-size: 13px; opacity: .85; }
        .header-meta { text-align: right; font-size: 12px; opacity: .85; line-height: 1.8; }

        .section-card {
            background: #fff; border-radius: 16px;
            padding: 24px 28px; margin-bottom: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,.06);
            border: 1px solid #eee;
        }
        .section-title {
            font-size: 11px; font-weight: 700; color: #aaa;
            letter-spacing: 1.5px; text-transform: uppercase;
            margin-bottom: 14px; padding-bottom: 10px;
            border-bottom: 1px solid #f0f0f0;
        }
        .type-badge {
            display: inline-block; padding: 8px 20px; border-radius: 50px;
            font-size: 16px; font-weight: 700; margin-bottom: 14px;
        }
        .bar-wrap { margin-bottom: 8px; }
        .bar-labels { display: flex; justify-content: space-between; font-size: 12px; color: #888; margin-bottom: 3px; }
        .bar-track { height: 7px; background: #f0f0f0; border-radius: 4px; overflow: hidden; }
        .bar-fill { height: 100%; border-radius: 4px; }
        .bar-fill.green  { background: linear-gradient(90deg,#66bb6a,#26a69a); }
        .bar-fill.red    { background: linear-gradient(90deg,#ef5350,#e91e63); }
        .bar-fill.blue   { background: linear-gradient(90deg,#42a5f5,#7e57c2); }
        .bar-fill.orange { background: linear-gradient(90deg,#ffa726,#ef5350); }

        .desc-text { font-size: 14px; color: #555; line-height: 1.7; margin-top: 10px; }
        .verse-text { font-size: 13px; color: #009aaa; margin-top: 8px; font-style: italic; }

        .counselor-box {
            background: #f0f4ff; border-left: 4px solid #7986cb;
            border-radius: 0 10px 10px 0; padding: 12px 16px; margin-top: 12px;
        }
        .counselor-box .label { font-size: 11px; font-weight: 700; color: #7986cb; margin-bottom: 4px; letter-spacing: .5px; }
        .counselor-box p { font-size: 13px; color: #555; line-height: 1.6; }

        .tone-row { display: flex; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
        .tone-pill { padding: 5px 12px; border-radius: 16px; font-size: 12px; font-weight: 700; }
        .tone-pill.pos { background: #e8f5e9; color: #2e7d32; }
        .tone-pill.neg { background: #fce4ec; color: #c62828; }
        .tone-pill.neu { background: #f3f3f3; color: #777; }

        .stc-item {
            display: flex; gap: 10px; align-items: flex-start;
            padding: 8px 12px; border-radius: 8px; margin-bottom: 6px;
            border-left: 3px solid #e0d0f8; background: #faf8ff;
        }
        .stc-item.pos { border-left-color: #66bb6a; }
        .stc-item.neg { border-left-color: #ef5350; }
        .stc-q { font-size: 11px; color: #aaa; margin-bottom: 2px; }
        .stc-a { font-size: 13px; font-weight: 500; color: #4a4a6a; }
        .stc-empty { font-size: 12px; color: #ccc; font-style: italic; }

        .warning-box {
            background: #fff3e0; border: 1.5px solid #ffcc80;
            border-radius: 10px; padding: 12px 16px; margin-top: 10px;
            font-size: 13px; color: #e65100;
        }

        .btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
        .btn-print {
            background: linear-gradient(135deg, #7c4dff, #5c35b1); color: #fff;
            border: none; border-radius: 50px; padding: 14px 36px;
            font-size: 15px; font-weight: 700; font-family: 'Noto Sans KR', sans-serif;
            cursor: pointer; box-shadow: 0 4px 16px rgba(124,77,255,.4);
        }
        .btn-close {
            background: #fff; color: #7c4dff;
            border: 2px solid #c5b9ea; border-radius: 50px; padding: 13px 32px;
            font-size: 15px; font-weight: 700; font-family: 'Noto Sans KR', sans-serif; cursor: pointer;
        }

        .error-screen { text-align: center; padding: 80px 20px; }
        .error-screen h2 { font-size: 20px; color: #888; margin-bottom: 12px; }

        /* ── Print styles ── */
        @media print {
            body { background: #fff; }
            .btn-row, .no-print { display: none !important; }
            .page-wrap { padding: 0; max-width: 100%; }
            .result-header { border-radius: 8px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .section-card { box-shadow: none; border: 1px solid #ddd; page-break-inside: avoid; }
            .bar-fill { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .type-badge { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body>
<div class="page-wrap" id="app">
    <div class="error-screen">
        <h2>결과를 불러오는 중...</h2>
    </div>
</div>

<script>
function bar(label, pct, color) {
    return `<div class="bar-wrap">
        <div class="bar-labels"><span>${label}</span><span>${pct}%</span></div>
        <div class="bar-track"><div class="bar-fill ${color}" style="width:${pct}%"></div></div>
    </div>`;
}

function toneClass(t) { return t===1?'pos':t===-1?'neg':''; }
function toneIcon(t)  { return t===1?'🟢':t===-1?'🔴':'🟡'; }

function render(d) {
    const app = document.getElementById('app');

    // Label maps by language
    const L = {
        ko: { title:'상담 결과지', name:'이름', birth:'생년월일', date:'검사일',
              t1:'검사 01', t2:'검사 02', t3:'검사 03', t4:'검사 04',
              type:'나의 유형', total:'전체 점수',
              desc:'분석', verse:'말씀',
              altruism:'이타성/절제', selfish:'이기성/자기중심',
              validity:'타당도', warning:'타당도 주의',
              print:'🖨️ PDF로 인쇄', close:'닫기',
              t1names:['🌿 안정형','🧊 무시형','🌊 집착형','🌀 혼란형'] },
        en: { title:'Counseling Report', name:'Name', birth:'Date of Birth', date:'Test Date',
              t1:'Assessment 01', t2:'Assessment 02', t3:'Assessment 03', t4:'Assessment 04',
              type:'My Type', total:'Total Score',
              desc:'Analysis', verse:'Scripture',
              altruism:'Altruism/Self-control', selfish:'Selfishness/Self-centered',
              validity:'Validity', warning:'Validity Warning',
              print:'🖨️ Print as PDF', close:'Close',
              t1names:['🌿 Secure','🧊 Dismissive','🌊 Anxious','🌀 Disorganized'] },
        zh: { title:'心理辅导报告', name:'姓名', birth:'出生日期', date:'测试日期',
              t1:'测试 01', t2:'测试 02', t3:'测试 03', t4:'测试 04',
              type:'我的类型', total:'总分',
              desc:'分析', verse:'经文',
              altruism:'利他性/克制', selfish:'自我中心',
              validity:'效度', warning:'效度警告',
              print:'🖨️ 打印为PDF', close:'关闭',
              t1names:['🌿 安全型','🧊 疏离型','🌊 焦虑型','🌀 混乱型'] },
        es: { title:'Informe de Consultoría', name:'Nombre', birth:'Fecha de Nacimiento', date:'Fecha del Test',
              t1:'Evaluación 01', t2:'Evaluación 02', t3:'Evaluación 03', t4:'Evaluación 04',
              type:'Mi Tipo', total:'Puntuación Total',
              desc:'Análisis', verse:'Escritura',
              altruism:'Altruismo/Autocontrol', selfish:'Egoísmo/Autocentrado',
              validity:'Validez', warning:'Advertencia de Validez',
              print:'🖨️ Imprimir como PDF', close:'Cerrar',
              t1names:['🌿 Seguro','🧊 Evitativo','🌊 Ansioso','🌀 Desorganizado'] },
    };
    const lang = (d.lang && L[d.lang]) ? d.lang : 'ko';
    const l = L[lang];

    const dateStr = d.at ? new Date(d.at).toLocaleDateString(lang==='ko'?'ko-KR':lang==='zh'?'zh-CN':'es', {year:'numeric',month:'long',day:'numeric'}) : '-';
    const birthStr = d.birth ? d.birth.replace(/-/g, '.') : '-';

    let h = `
    <div class="result-header">
        <div>
            <div class="org">✦ ELIM CENTER ✦</div>
            <h1>${l.title}</h1>
            <div class="sub">${d.name || '-'}</div>
        </div>
        <div class="header-meta">
            ${l.name}: <strong>${d.name||'-'}</strong><br>
            ${l.birth}: ${birthStr}<br>
            ${l.date}: ${dateStr}<br>
            ID: ${d.id||'-'}
        </div>
    </div>`;

    // T1
    if (d.t1) {
        const t = d.t1;
        const maxS=[55,60,45,40]; const scores=[t.s,t.a,t.x,t.d]; const colors=['green','blue','orange','red'];
        h += `<div class="section-card">
            <div class="section-title">${l.t1}</div>
            <div class="type-badge" style="background:#e8f5e9;color:#2e7d32">${t.emoji} ${t.type}</div>
            ${l.t1names.map((n,i) => bar(n, Math.round(scores[i]/maxS[i]*100), colors[i])).join('')}
            <p class="desc-text">${t.desc}</p>
            ${t.verse ? `<p class="verse-text">📖 ${t.verse}</p>` : ''}
        </div>`;
    }

    // T2
    if (d.t2) {
        const t = d.t2;
        const cats = t.cats || t.scores || [];
        h += `<div class="section-card">
            <div class="section-title">${l.t2}</div>
            <div class="type-badge" style="background:#f3e5f5;color:#6a1b9a">${t.emoji} ${t.type}</div>
            ${cats.map(c => bar(c.name, c.pct, c.color)).join('')}
            <div style="display:flex;justify-content:space-between;align-items:center;
                        margin-top:12px;padding:10px 14px;background:#f3e5f5;border-radius:8px">
                <span style="font-size:13px;color:#6a1b9a;font-weight:600">📊 ${l.total}</span>
                <span style="font-size:17px;font-weight:700;color:#6a1b9a">${t.sum||0} (${t.totalPct||0}%)</span>
            </div>
            <p class="desc-text">${t.desc||''}</p>
            ${t.verse ? `<p class="verse-text">📖 ${t.verse}</p>` : ''}
        </div>`;
    }

    // T3
    if (d.t3) {
        const t = d.t3;
        const cats = t.cats || t.scores || [];
        h += `<div class="section-card">
            <div class="section-title">${l.t3}</div>
            <div class="type-badge" style="background:#e8f5e9;color:#2e7d32">${t.emoji} ${t.type}</div>
            ${cats.map(c => bar(c.name, c.pct, c.color)).join('')}
            <div style="display:flex;justify-content:space-between;align-items:center;
                        margin-top:12px;padding:10px 14px;background:#e8f5e9;border-radius:8px">
                <span style="font-size:13px;color:#2e7d32;font-weight:600">📊 ${l.total}</span>
                <span style="font-size:17px;font-weight:700;color:#2e7d32">${t.sum||0} (${t.totalPct||0}%)</span>
            </div>
            <p class="desc-text">${t.desc||''}</p>
            ${t.verse ? `<p class="verse-text">📖 ${t.verse}</p>` : ''}
        </div>`;
    }

    // T4
    if (d.t4) {
        const t = d.t4;
        const altP = Math.round((t.alt||0)/95*100);
        const selP = Math.round((t.sel||0)/95*100);
        h += `<div class="section-card">
            <div class="section-title">${l.t4}</div>
            <div class="type-badge" style="background:#fff8e1;color:#e65100">${t.emoji} ${t.type}</div>
            ${bar('🟢 '+l.altruism, altP, 'green')}
            ${bar('🔴 '+l.selfish,  selP, 'red')}
            ${t.warn ? `<div class="warning-box">⚠️ ${l.warning}: ${t.val}/10</div>` : ''}
            <p class="desc-text">${t.desc}</p>
        </div>`;
    }

    // Buttons
    h += `<div class="btn-row">
        <button class="btn-print" onclick="window.print()">${l.print}</button>
        <button class="btn-close" onclick="window.close()">${l.close}</button>
    </div>`;

    app.innerHTML = h;
}

// Parse URL
(function() {
    const params = new URLSearchParams(location.search);
    const d = params.get('d');
    if (!d) {
        document.getElementById('app').innerHTML = '<div class="error-screen"><h2>결과 데이터가 없습니다.</h2><p style="color:#aaa;margin-top:8px">올바른 결과 링크를 사용해 주세요.</p></div>';
        return;
    }
    try {
        const data = JSON.parse(decodeURIComponent(escape(atob(d))));
        render(data);
    } catch(e) {
        document.getElementById('app').innerHTML = '<div class="error-screen"><h2>결과를 불러올 수 없습니다.</h2><p style="color:#aaa;margin-top:8px">링크가 올바르지 않습니다.</p></div>';
    }
})();
</script>
</body>
</html>
